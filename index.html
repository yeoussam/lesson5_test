<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson 5 Unit Test Tutor</title>
<style>
:root{
  --bg:#f5f8fc; --card:#ffffff; --ink:#172033; --muted:#667085; --line:#dfe7f0;
  --blue:#356fb3; --blue2:#28598f; --bluebg:#eef6ff;
  --green:#166534; --greenbg:#f0fdf4; --amber:#8a4b08; --amberbg:#fffbeb;
  --slate:#334155; --soft:#f8fafc;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh;
  background:linear-gradient(180deg,#f8fbff 0%,#eef3f9 100%);
  color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;
}
.wrap{width:min(940px,calc(100% - 20px));margin:0 auto;padding:18px 0 42px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.brand{font-weight:900;color:#42658b;font-size:14px}
.smallbtn{border:1px solid var(--line);background:#fff;color:#52657a;border-radius:11px;padding:9px 13px;font-weight:800;cursor:pointer}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 36px rgba(22,50,79,.08);overflow:hidden}

.start{padding:36px}
.unitpill{display:inline-flex;align-items:center;gap:8px;background:#eaf4ff;color:#28598f;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900;margin-bottom:14px}
h1{font-size:clamp(31px,5vw,46px);line-height:1.12;margin:0 0 14px;color:#17324f}
.sub{margin:0;color:var(--muted);line-height:1.75}
.startgrid{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:12px;margin-top:25px}
label{display:block;font-size:13px;font-weight:900;color:#52657a;margin-bottom:7px}
input[type=text]{width:100%;border:1px solid #cbd7e4;border-radius:12px;padding:13px 14px;font-size:16px;outline:none}
input[type=text]:focus{border-color:#6d99c7;box-shadow:0 0 0 3px rgba(64,120,178,.12)}
.btn{border:0;border-radius:12px;padding:13px 17px;font-size:15px;font-weight:900;cursor:pointer}
.primary{background:var(--blue);color:white}.primary:hover{background:var(--blue2)}
.secondary{background:#eef3f8;color:#334155}
.start .primary{width:100%;margin-top:15px}
.rules{margin-top:18px;padding:15px 17px;border-radius:14px;background:#f8fbff;border:1px solid #e0ebf5;color:#52657a;font-size:13px;line-height:1.75}
.notice{font-size:12px;color:#98a2b3;padding:16px 34px 24px;border-top:1px solid var(--line);background:#fbfdff;line-height:1.6}

.head{padding:18px 24px;border-bottom:1px solid var(--line);background:#fbfdff}
.headrow{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}
.qnum{font-weight:950;font-size:18px;color:#294f75}.progtext{font-size:12px;color:#667085;font-weight:800}
.progress{height:8px;background:#e6edf5;border-radius:99px;overflow:hidden;margin-top:11px}
.progress>div{height:100%;background:#4a82bb;transition:width .25s}
.main{padding:24px;min-height:540px}
.messages{display:flex;flex-direction:column;gap:11px;margin-bottom:18px}
.msg{max-width:90%;padding:13px 15px;border-radius:15px;line-height:1.68;white-space:pre-line;font-size:15px}
.tutor{align-self:flex-start;background:#f1f6fb;border:1px solid #e0e9f2;border-bottom-left-radius:5px}
.student{align-self:flex-end;background:#365d84;color:#fff;border-bottom-right-radius:5px}
.good{background:var(--greenbg);border-color:#bbf7d0;color:var(--green)}
.warn{background:var(--amberbg);border-color:#fde68a;color:#78350f}
.info{background:#eff8ff;border-color:#bae0ff;color:#075985}
.questionbox{border:1px solid #dbe5ef;border-radius:16px;padding:19px;background:#fff}
.instruction{font-weight:900;color:#4b6178;font-size:14px;margin-bottom:12px}
.stem{font-weight:750;line-height:1.78;white-space:pre-line;margin-bottom:14px}
.passage{
  border:1px solid #dfe7ef;background:#fafcff;border-radius:14px;padding:16px 17px;
  line-height:1.72;white-space:pre-line;margin-bottom:15px;font-size:14px;
}
.passage b{color:#243b53}
.options{display:grid;gap:9px}
.opt{display:flex;gap:10px;text-align:left;align-items:flex-start;padding:12px 13px;border:1px solid #dbe2ea;border-radius:12px;background:#fff;cursor:pointer;font-size:15px;line-height:1.52}
.opt:hover{background:#f7fafc}.opt .n{font-weight:950;color:#42658b;flex:none}
.answerrow{display:flex;gap:9px}.answerrow input{flex:1}
.multiFields{display:grid;gap:12px}
.fieldrow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center}
.fieldlabel{font-size:13px;font-weight:900;color:#52657a}
.next{display:flex;justify-content:flex-end;margin-top:15px}
.signimg{display:block;max-width:560px;width:100%;height:auto;margin:10px auto 15px;border-radius:12px;border:1px solid #edf1f5}
.dataTable{border-collapse:collapse;margin:10px 0 15px;min-width:360px;max-width:100%}
.dataTable th,.dataTable td{border:1px solid #94a3b8;padding:7px 13px;text-align:center;font-size:14px}
.dataTable th{background:#f1f5f9}
.statementList{display:grid;gap:7px;margin-bottom:13px}
.statement{padding:9px 11px;border-radius:10px;background:#f8fafc;border:1px solid #edf2f7;line-height:1.55}
.complete{padding:32px;text-align:center;position:relative;overflow:hidden;background:linear-gradient(180deg,#ffffff 0%,#f4faff 100%)}
.complete h2{font-size:clamp(30px,5vw,44px);margin:7px 0 9px;color:#244f78}
.complete .lead{font-size:17px;color:#52657a;line-height:1.7;margin:0 auto 19px;max-width:650px}
.fanfare{width:min(520px,92%);margin:3px auto 12px;display:block}
.completeCard{max-width:650px;margin:18px auto;padding:20px;border-radius:18px;background:#fff;border:2px solid #b9d8f5;box-shadow:0 10px 25px rgba(39,96,145,.08)}
.doneTitle{font-size:24px;font-weight:950;color:#173f65;margin-bottom:13px}
.identity{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.idbox{background:#f6faff;border:1px solid #dbeaf7;border-radius:11px;padding:11px}
.idbox .sm{font-size:11px;color:#7690a8;font-weight:800}.idbox .big{font-size:16px;font-weight:950;color:#314f6b;margin-top:2px}
.timebox{font-size:13px;color:#61788f;margin:9px 0 15px}
.submitGuide{
  padding:17px;border-radius:14px;background:#fff7dd;border:1px solid #f4d77a;color:#6f4b00;
  font-weight:850;line-height:1.7;font-size:16px
}
.captureTip{margin-top:9px;font-size:12px;color:#7b8794}
.confetti{position:absolute;width:9px;height:18px;border-radius:2px;opacity:.78;animation:fall 5s linear infinite}
@keyframes fall{0%{transform:translateY(-80px) rotate(0deg)}100%{transform:translateY(720px) rotate(540deg)}}
@media(max-width:650px){
  .wrap{width:min(100% - 12px,940px);padding-top:8px}.start,.main,.complete{padding:20px}.head{padding:16px 20px}
  .startgrid{grid-template-columns:1fr}.msg{max-width:96%}.answerrow{flex-direction:column}
  .fieldrow{grid-template-columns:1fr}.identity{grid-template-columns:1fr 1fr}.identity .idbox:last-child{grid-column:1 / -1}
  .dataTable{min-width:0;width:100%}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Lesson 5 · Unit Test Learning Tutor</div>
    <button id="reset" class="smallbtn">처음부터</button>
  </div>
  <div id="app" class="card"></div>
</div>

const marks=["①","②","③","④","⑤"];
const freshState=()=>({
  started:false, cls:"", no:"", name:"", idx:0,
  attempts:QUESTIONS.map(()=>0), history:[], phase:"question", finished:false, completedAt:""
});
let S=freshState();
const app=document.getElementById("app");
const reset=document.getElementById("reset");

function esc(x){
 return String(x??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
}
function norm(x){
 return String(x??"").toLowerCase().replace(/[’‘`]/g,"'").replace(/['"]/g,"").replace(/[.,!?]/g,"").replace(/\s+/g," ").trim();
}
function save(){localStorage.setItem("lesson5UnitTutorV1",JSON.stringify(S))}
function load(){
 try{
   const x=JSON.parse(localStorage.getItem("lesson5UnitTutorV1"));
   if(x && Array.isArray(x.attempts) && x.attempts.length===QUESTIONS.length) S={...freshState(),...x};
 }catch{}
}
function add(role,text,kind=""){
 S.history.push({role,text,kind});
 if(S.history.length>36) S.history=S.history.slice(-36);
 save();
}
function current(){return QUESTIONS[S.idx]}
function renderMessages(){
 return S.history.slice(-10).map(m=>`<div class="msg ${m.role==="student"?"student":"tutor"} ${m.kind||""}">${esc(m.text)}</div>`).join("");
}
function renderStart(){
 app.innerHTML=`<section class="start">
   <div class="unitpill">Lesson 5 · 단원평가 복습</div>
   <h1>Unit Test<br>Learning Tutor</h1>
   <p class="sub">단원평가 문제를 한 문제씩 풀어 봅시다. 틀리면 정답을 바로 알려주지 않고 힌트를 제공합니다.<br>모든 문제를 해결하면 과제 완료 화면이 나타납니다.</p>
   <div class="startgrid">
     <div><label>반 *</label><input id="cls" type="text" maxlength="10" placeholder="예: 3"></div>
     <div><label>번호 *</label><input id="no" type="text" maxlength="10" placeholder="예: 12"></div>
     <div><label>이름 *</label><input id="name" type="text" maxlength="20" placeholder="예: 김민수"></div>
   </div>
   <button id="start" class="btn primary">학습 시작하기</button>
   <div class="rules"><b>학습 방법</b><br>
   ① 한 문제씩 해결합니다. &nbsp; ② 틀리면 힌트를 읽고 다시 도전합니다.<br>
   ③ 정답을 직접 맞혀야 다음 문제로 넘어갑니다. &nbsp; ④ 마지막 완료 화면을 캡처해 제출합니다.</div>
 </section>
 <div class="notice">반·번호·이름과 학습 진행 기록은 이 기기의 브라우저에만 저장되며 별도 서버로 전송되지 않습니다.</div>`;
 document.getElementById("start").onclick=()=>{
   const cls=document.getElementById("cls").value.trim();
   const no=document.getElementById("no").value.trim();
   const name=document.getElementById("name").value.trim();
   if(!cls||!no||!name){alert("반, 번호, 이름을 모두 입력해 주세요.");return;}
   S.started=true;S.cls=cls;S.no=no;S.name=name;
   add("tutor",`${name} 학생, 시작해 볼까요? 틀려도 괜찮아요. 힌트를 읽고 스스로 정답을 찾아보세요.`);
   render();
 };
}
function mainQuestionBox(q){
 let content=`<div class="questionbox"><div class="instruction">문제 ${esc(q.id)} · ${esc(q.instruction)}</div>`;
 if(q.passage) content+=`<div class="passage">${esc(q.passage)}</div>`;
 if(q.statements){
   content+=`<div class="statementList">${q.statements.map(s=>`<div class="statement">${esc(s)}</div>`).join("")}</div>`;
 }
 if(q.tableHtml) content+=q.tableHtml;
 if(q.stem) content+=`<div class="stem">${esc(q.stem)}</div>`;
 if(q.type==="mcImage") content+=`<img class="signimg" src="${Q5_IMAGE}" alt="문제 5 표지판 보기">`;

 if(["mc","mcImage","mcStatements","mcTable"].includes(q.type)){
   content+=`<div class="options">${q.options.map((o,k)=>`<button class="opt qopt" data-k="${k}"><span class="n">${marks[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
 }else if(q.type==="text"){
   content+=`<div class="answerrow"><input id="textAnswer" type="text" autocomplete="off" placeholder="정답을 입력하세요"><button id="textGo" class="btn primary">확인</button></div>`;
 }else if(q.type==="multiText"){
   content+=`<div class="multiFields">`+q.fields.map((f,i)=>`<div class="fieldrow"><div class="fieldlabel">${esc(f.label)}</div><input class="multiInput" data-i="${i}" type="text" autocomplete="off" placeholder="정답 입력"></div>`).join("")+
   `</div><div style="margin-top:12px"><button id="multiGo" class="btn primary">확인</button></div>`;
 }
 return content+`</div>`;
}
function renderQuestion(){
 const q=current();
 const pct=Math.round((S.idx/QUESTIONS.length)*100);
 app.innerHTML=`<div class="head"><div class="headrow"><div class="qnum">문제 ${esc(q.id)}</div><div class="progtext">${S.idx+1} / ${QUESTIONS.length}</div></div>
   <div class="progress"><div style="width:${pct}%"></div></div></div>
   <div class="main"><div class="messages">${renderMessages()}</div>${mainQuestionBox(q)}</div>`;
 window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
 document.querySelectorAll(".qopt").forEach(b=>b.onclick=()=>submitMC(Number(b.dataset.k)));
 const t=document.getElementById("textAnswer");
 if(t){
   document.getElementById("textGo").onclick=()=>submitText(t.value);
   t.addEventListener("keydown",e=>{if(e.key==="Enter")submitText(t.value)});
   setTimeout(()=>t.focus(),0);
 }
 const mg=document.getElementById("multiGo");
 if(mg) mg.onclick=submitMulti;
}
function wrongMessage(q){
 const n=S.attempts[S.idx];
 const hint=q.hints[Math.min(n-1,q.hints.length-1)];
 const label=n===1?"💡 힌트":n===2?"🔎 조금 더 생각해 볼까요?":"📘 핵심 단서";
 return `${label}\n${hint}\n\n원래 문제를 다시 풀어 보세요.`;
}
function submitMC(k){
 const q=current();
 add("student",`${marks[k]} ${q.options[k]}`);
 S.attempts[S.idx]++;
 if(k===q.answer){
   add("tutor",`정답입니다! 🎉\n${q.explanation}`,"good");
   transition();
 }else{
   add("tutor",wrongMessage(q),"warn");
   renderQuestion();
 }
}
function submitText(v){
 const q=current();
 if(!String(v).trim()) return;
 add("student",String(v));
 S.attempts[S.idx]++;
 const ok=q.accepted.some(a=>norm(a)===norm(v));
 if(ok){
   add("tutor",`정답입니다! 🎉\n${q.explanation}`,"good");
   transition();
 }else{
   add("tutor",wrongMessage(q),"warn");
   renderQuestion();
 }
}
function submitMulti(){
 const q=current();
 const vals=[...document.querySelectorAll(".multiInput")].map(x=>x.value.trim());
 if(vals.some(v=>!v)){alert("모든 빈칸에 답을 입력해 주세요.");return;}
 add("student",vals.map((v,i)=>`${q.fields[i].label}: ${v}`).join("\n"));
 S.attempts[S.idx]++;
 const ok=q.fields.every((f,i)=>f.accepted.some(a=>norm(a)===norm(vals[i])));
 if(ok){
   add("tutor",`정답입니다! 🎉\n${q.explanation}`,"good");
   transition();
 }else{
   add("tutor",wrongMessage(q),"warn");
   renderQuestion();
 }
}
function transition(){
 S.phase="transition";save();
 const done=S.idx===QUESTIONS.length-1;
 const pct=Math.round(((S.idx+1)/QUESTIONS.length)*100);
 app.innerHTML=`<div class="head"><div class="headrow"><div class="qnum">문제 ${esc(current().id)} 해결 완료</div><div class="progtext">${S.idx+1} / ${QUESTIONS.length}</div></div>
 <div class="progress"><div style="width:${pct}%"></div></div></div>
 <div class="main"><div class="messages">${renderMessages()}</div><div class="next"><button id="next" class="btn primary">${done?"과제 완료 확인하기":"다음 문제 →"}</button></div></div>`;
 document.getElementById("next").onclick=()=>{
   if(done){
     S.finished=true;
     S.completedAt=new Date().toISOString();
     save();renderComplete();
   }else{
     S.idx++;S.phase="question";
     add("tutor",`좋아요. 다음은 문제 ${QUESTIONS[S.idx].id}입니다.`);
     renderQuestion();
   }
 };
}

 <text x="350" y="213" text-anchor="middle" font-size="23" font-weight="800" fill="#5d748a">Great job!</text>
 </svg>`;
}
function confettiHtml(){
 const colors=["#f35b66","#ffd44d","#55b981","#6d8cff","#ff8f4e","#70c7d4"];
 let s="";
 for(let i=0;i<22;i++){
   const left=(i*43+7)%100;
   const delay=(i%8)*0.37;
   const dur=4.3+(i%5)*0.45;
   s+=`<span class="confetti" style="left:${left}%;top:-40px;background:${colors[i%colors.length]};animation-delay:${delay}s;animation-duration:${dur}s;transform:rotate(${i*19}deg)"></span>`;
 }
 return s;
}
function formatCompletionTime(){
 const d=S.completedAt?new Date(S.completedAt):new Date();
 return new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"long",day:"numeric",hour:"numeric",minute:"2-digit"}).format(d);
}
function renderComplete(){
 app.innerHTML=`<section class="complete">${confettiHtml()}
   ${fanfareSvg()}
   <h2>수고했어요! 🎉</h2>
   <p class="lead"><b>${esc(S.name)}</b> 학생, Lesson 5 단원평가 학습을 모두 마쳤습니다.<br>25문항을 끝까지 해결했어요.</p>
   <div class="completeCard">
     <div class="doneTitle">✅ 과제 완료</div>
     <div class="identity">
       <div class="idbox"><div class="sm">반</div><div class="big">${esc(S.cls)}반</div></div>
       <div class="idbox"><div class="sm">번호</div><div class="big">${esc(S.no)}번</div></div>
       <div class="idbox"><div class="sm">이름</div><div class="big">${esc(S.name)}</div></div>
     </div>
     <div class="timebox">완료 시각: ${esc(formatCompletionTime())}</div>
     <div class="submitGuide">📸 이 <b>과제 완료 페이지가 보이도록 화면을 캡처</b>한 뒤,<br><b>“다했어요”에 제출하세요.</b></div>
     <div class="captureTip">반·번호·이름과 ‘과제 완료’ 문구가 함께 보이도록 캡처하세요.</div>
   </div>
   <button id="review" class="btn secondary">처음부터 다시 풀기</button>
 </section>`;
 document.getElementById("review").onclick=hardReset;
 window.scrollTo({top:0,behavior:"smooth"});
}
function hardReset(){
 localStorage.removeItem("lesson5UnitTutorV1");
 S=freshState();renderStart();
}
reset.onclick=()=>{if(confirm("현재 학습 기록을 지우고 처음부터 시작할까요?"))hardReset()}
function render(){
 if(!S.started)return renderStart();
 if(S.finished)return renderComplete();
 if(S.phase==="transition")return transition();
 renderQuestion();
}
load();render();
</script>
